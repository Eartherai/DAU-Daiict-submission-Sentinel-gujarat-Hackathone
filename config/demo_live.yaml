# Phase 6 judge configuration. Values are defaults for the browser-facing path;
# the authenticated catalogue remains authoritative for per-camera URLs/codecs.
stream_path:
  preferred: WEBRTC_DIRECT
  fallback: [WEBRTC_TRANSCODED, HLS, SNAPSHOT]
  direct_source: government_catalogue
  transport: tcp
  browser_codec: h264
quality:
  command: {width: 960, height: 540, max_fps: 15, bitrate_kbps: 900}
  focus: {width: 1920, height: 1080, max_fps: 30, bitrate_kbps: 3500}
  grid: {width: 640, height: 360, max_fps: 10, bitrate_kbps: 450}
  forensic: {width: 1920, height: 1080, max_fps: 30, bitrate_kbps: 5000}
reconnect:
  no_frame_after_ms: 3000
  max_attempts: 4
  backoff_initial_s: 2
  backoff_max_s: 30
inference:
  mode: NORMAL
  detector_every_n_frames: 3
  tracker_every_n_frames: 1
  ocr_every_n_frames: 3
  overlay_fps: 15
wall:
  mode: grid
  slots: 9
  priority: all
  selected_camera: focus_only
  duplicate_upstream_sessions: false
analytics:
  video_independent_of_inference: true
  overlay_on: true
  fallback_to_snapshot_on_whep_failure: true
